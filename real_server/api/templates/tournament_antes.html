<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Torneo</title>
    <style>
        body {
            margin: 0; padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #1A3636;
            color: #D6BD98;
        }
        canvas {
            background-color: #40534C;
            border: 2px solid #667D6A;
            display: block;
            margin: 20px auto;
        }
        .controlPause {
            position: absolute;
            top: 20px; right: 20px;
            z-index: 1000;
        }
        .controlHome {
            position: absolute;
            top: 20px; left: 20px;
            z-index: 1000;
        }
        #log {
            background: #667D6A;
            padding: 10px;
            height: 300px; width: 500px;
            overflow-y: scroll;
            font-family: monospace;
            margin-top: 10px;
            margin: 10px auto;
        }
        /* Bracket visual */
        #bracket {
            display: flex;
            gap: 40px;
            justify-content: center;
            padding: 20px;
            align-items: center;
        }
        .round {
            display: flex;
            flex-direction: column;
            gap: 20px;
            justify-content: center;
        }
        .match {
            border: 1px solid #D6BD98;
            background-color: #40534C;
            color: #D6BD98;
            padding: 8px 12px;
            border-radius: 5px;
            min-width: 120px;
            text-align: center;
            font-weight: bold;
        }
        .winner {
            color: #4CAF50;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <div class="controlPause">
        <button id="pauseButton">Pausar</button>
    </div>
    <div class="controlHome">
        <button id="goHome">Go Home</button>
    </div>
    <h2 style="text-align: center;">Orden de Partidas (Bracket)</h2>
    <div id="bracket"></div>
    <div id="log"></div>

    <!-- <input type="hidden" id="tournamentId" value="1"> -->
    <script src="../static/tournament.js"></script>
</body>
</html>
